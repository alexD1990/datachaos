version: 1
seed: 2026
dataset:
  as_of: "2026-01-08T00:00:00Z"
  customers: 40
  orders: 400
  batches: 5
  batch_interval: 1d
scenarios:
  - name: schema-drift
    table: orders
    params: {operation: change_type, column: amount, to: string_comma_decimal, from_batch: 3}
expectations:
  - scenario: schema-drift
    # stg_orders stays at the last batch it could read while the events go on, so that events of
    # later batches refer to orders it does not have. That is a real consequence of the cast error.
    failing_tests:
      - "model.dbt_shop.stg_orders"
      - "test.dbt_shop.relationships_stg_order_events_order_id*"
