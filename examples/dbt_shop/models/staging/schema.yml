version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: country_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                # Quoted, since YAML reads a bare NO as false.
                values: ["NO", SE, DK, FI, DE]
      - name: customer_segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [consumer, smb, enterprise]
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [created, paid, shipped, delivered, cancelled]
      - name: amount
        data_tests: [not_null]
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [NOK, SEK, DKK, EUR]
      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [webshop, pos, b2b_api]
  - name: stg_order_events
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [created, paid, shipped, delivered, cancelled]
