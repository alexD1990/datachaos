[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "datachaos"
dynamic = ["version"]
description = "Inject controlled data quality faults into synthetic batches and check that your dbt tests catch them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandro Dronnen" }]
keywords = ["data-quality", "dbt", "chaos-engineering", "synthetic-data", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/alexD1990/datachaos"
Repository = "https://github.com/alexD1990/datachaos"
Changelog = "https://github.com/alexD1990/datachaos/blob/master/CHANGELOG.md"
Issues = "https://github.com/alexD1990/datachaos/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9", "mypy==2.3.1", "jsonschema>=4.18", "types-PyYAML"]
# Only for the demo in examples/dbt_shop. dbt v2 is another program, so stay on v1.
dbt = ["dbt-core>=1.10,<2", "dbt-duckdb>=1.10,<2"]

[project.scripts]
datachaos = "datachaos.cli:main"

[tool.hatch.version]
path = "src/datachaos/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/datachaos"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "schema", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = [".github"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/build-plan.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers"
markers = ["dbt: requires dbt-duckdb"]
