version: 1
seed: 20260113
dataset:
  as_of: "2026-01-08T00:00:00Z"
  customers: 20
  orders: 80
  batches: 4
  batch_interval: 1d
output:
  formats: [csv]
  emit_row_ids: true
scenarios:
  - name: schema-drift
    table: orders
    params: {operation: rename_column, column: source_system, new_name: channel, from_batch: 2}
  - name: duplicate-business-key
    table: orders
    params: {count: 4, same_batch: false}
  - name: null-critical-column
    table: orders
    params: {column: amount, count: 4}
  - name: invalid-enum
    table: orders
    params: {column: currency, count: 4, variant: case_change}
  - name: orphaned-foreign-key
    table: orders
    params: {mode: deleted_parent, count: 2}
  - name: late-arriving-data
    table: order_events
    params: {count: 8, delay_min: 6h, delay_max: 1d}
  - name: out-of-order-events
    table: order_events
    params: {count: 5}
  - name: historical-update
    table: orders
    params: {older_than: 1d, count: 4, columns: [status]}
