version: 1
seed: 20260111
dataset:
  as_of: "2026-01-08T00:00:00Z"
  customers: 20
  orders: 50
  batches: 3
  batch_interval: 1d
output:
  formats: [csv, jsonl]
scenarios:
  - name: schema-drift
    table: orders
    params: {operation: change_type, column: amount, to: string_comma_decimal, from_batch: 1}
  - name: schema-drift
    table: orders
    params: {operation: rename_column, column: source_system, new_name: channel, from_batch: 2}
  - name: schema-drift
    table: customers
    params: {operation: drop_column, column: customer_segment, from_batch: 1}
  - name: schema-drift
    table: order_events
    params: {operation: add_column, column: region, fill: generated, from_batch: 1}
